<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JoluFish · Jolu Games</title>
<meta name="description" content="JoluFish: juego de pesca para toda la familia. A fishing game for the whole family.">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Figtree:wght@500;700;800&display=swap">
<style>
/* Una sola pantalla de estanque (look fijo, oscuro): agua del juego, papel crema para las tarjetas */
:root{--water:#0f5b63;--deep:#073740;--paper:#fff7e6;--ink:#15302e;--gold:#ffbe2e;--coral:#ff5a3c;--muted:#9fc9c6;
--display:"Baloo 2",system-ui,sans-serif;--body:Figtree,system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}a{color:var(--gold)}
body{background:radial-gradient(120% 80% at 50% 0%,#1a7d82 0%,var(--water) 45%,var(--deep) 100%) fixed,var(--deep);color:var(--paper);font:500 16px/1.55 var(--body)}
.wrap{max-width:720px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
.top{display:flex;justify-content:flex-end}
.lang{display:flex;gap:4px;background:rgba(0,0,0,.25);padding:4px;border-radius:12px}
.lang button{border:0;border-radius:9px;padding:6px 12px;font:800 13px var(--body);background:transparent;color:var(--paper);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.lang button:focus-visible,.cta:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.logo{width:min(100%,460px);height:auto;filter:drop-shadow(0 10px 22px rgba(0,0,0,.35))}
h1{font:800 clamp(26px,6vw,38px)/1.1 var(--display);margin:0;text-wrap:balance}
.lead{margin:0;max-width:52ch;color:#d9efec;font-size:17px}
.cta{display:inline-flex;align-items:center;gap:10px;background:var(--coral);color:#fff;font:800 16px var(--body);padding:13px 22px;border-radius:16px;box-shadow:0 5px 0 #b8331c}
.cta small{font-weight:700;opacity:.85}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.facts div{background:rgba(0,0,0,.22);border-radius:16px;padding:14px 10px;text-align:center}
.facts b{display:block;font:800 30px/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.facts span{font-size:13px;color:var(--muted);font-weight:700}
.card{background:var(--paper);color:var(--ink);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:10px}
.card h2{font:800 22px/1.2 var(--display);margin:0}
.card p{margin:0}
.card ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
footer{text-align:center;font-size:13px;color:var(--muted)}
@media (max-width:420px){.facts b{font-size:24px}}
</style>
</head>
